# Enhanced TriggerBinding
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-binding
  namespace: dev
spec:
  params:
  - name: git-repo-url
    value: $(body.repository.clone_url)
  - name: git-commit-id
    value: $(body.head_commit.id)
  - name: git-branch
    value: $(body.ref)
