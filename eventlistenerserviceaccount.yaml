---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-github-sa
  namespace: dev
---
# Namespace Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-github-role
  namespace: dev
rules:
- apiGroups: [""]
  resources: ["pods", "services", "secrets", "configmaps", "events"]
  verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: ["tekton.dev"]
  resources: ["pipelines", "pipelineruns", "taskruns", "conditions"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: ["triggers.tekton.dev"]
  resources: ["eventlisteners", "triggerbindings", "triggertemplates", "triggers", "interceptors"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
---
# Namespace RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-github-binding
  namespace: dev
subjects:
- kind: ServiceAccount
  name: tekton-triggers-github-sa
  namespace: dev
roleRef:
  kind: Role
  name: tekton-triggers-github-role
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole (for cluster-scoped resources)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-github-clusterrole
rules:
- apiGroups: ["triggers.tekton.dev"]
  resources: ["clustertriggerbindings", "clusterinterceptors"]
  verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-github-clusterbinding
subjects:
- kind: ServiceAccount
  name: tekton-triggers-github-sa
  namespace: dev
roleRef:
  kind: ClusterRole
  name: tekton-triggers-github-clusterrole
  apiGroup: rbac.authorization.k8s.io
