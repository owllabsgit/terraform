# github-trigger-template.yaml
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: github-trigger-template
  namespace: dev
spec:
  params:
    - name: git-repo-url
    - name: git-commit-id
    # 👇 ADD IMAGE HERE (you can hardcode or derive it)
    - name: IMAGE
      default: "docker.io/owllabsdocker/test1-owl"  # ← your image
    - name: DOCKERFILE
      default: "./Dockerfile"
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ci-run-
        namespace: dev
      spec:
        serviceAccountName: build-bot  # ← important!
        pipelineRef:
          name: ci-pipeline
        params:
          - name: repo-url
            value: $(tt.params.git-repo-url)
          - name: revision
            value: $(tt.params.git-commit-id)
          - name: IMAGE
            value: $(tt.params.IMAGE)
          - name: DOCKERFILE
            value: $(tt.params.DOCKERFILE)
        workspaces:
          - name: shared-workspace
            persistentVolumeClaim:
              claimName: tekton-workspace
          - name: docker-config
            secret:
              secretName: reg-creds
