# test-task.yaml
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test-task
  namespace: dev
spec:
  workspaces:
    - name: source
      description: "Cloned source code"

  steps:
    - name: run-simple-tests
      image: composer:2    # ✅ Pre-installed Composer + PHP 8.2 — NO DOWNLOAD NEEDED
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        echo "🧪 Simple Test Task Started (Using Pre-Installed Composer)"

        # Install dependencies — SKIP SCRIPTS + IGNORE PLATFORM
        if [ -f "composer.json" ]; then
          echo "📥 Running: composer install --no-scripts --ignore-platform-req=ext-*"
          composer install --no-interaction --prefer-dist --no-scripts --ignore-platform-req=ext-*
          echo "✅ Dependencies installed"
        else
          echo "⚠️  No composer.json found — skipping install"
        fi

        # Run phpunit if exists
        if [ -f "vendor/bin/phpunit" ]; then
          echo "▶️  Running: vendor/bin/phpunit"
          vendor/bin/phpunit
          echo "✅ Tests passed"
        else
          echo "ℹ️  No phpunit found — skipping tests (not a failure)"
        fi

        echo "🎉 Simple Test Task Completed Successfully"
