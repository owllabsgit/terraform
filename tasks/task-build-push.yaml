apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kaniko-build-push-task
  namespace: dev
spec:
  params:
    - name: IMAGE
      type: string
    - name: DOCKERFILE
      type: string
      default: ./Dockerfile
    - name: COMMIT_SHA
      type: string
      description: Git commit SHA to use as image tag
  workspaces:
    - name: source
      description: Source code with Dockerfile
    - name: docker-config
      description: Docker config for registry authentication
  steps:
    - name: execute-build
      image: gcr.io/kaniko-project/executor:v1.23.2
      workingDir: $(workspaces.source.path)
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(params.DOCKERFILE)
        - --context=dir://$(workspaces.source.path)
        - --destination=$(params.IMAGE):$(params.COMMIT_SHA)
        - --verbosity=info
      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker

    - name: post-build-logs
      image: alpine:latest
      script: |
        #!/bin/sh
        echo "✅ === IMAGE BUILT AND PUSHED SUCCESSFULLY ==="
        echo "📦 Image: $(params.IMAGE):$(params.COMMIT_SHA)"
  volumes:
    - name: docker-config
      secret:
        secretName: reg-creds
        items:
          - key: .dockerconfigjson
            path: config.json

