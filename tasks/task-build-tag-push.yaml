apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-tag-push-task
  namespace: dev
spec:
  workspaces:
    - name: source
      description: Source code workspace (your cloned repo)
    - name: dockerconfig
      description: Docker credentials
  params:
    - name: image
      type: string
      description: Full Docker image name (e.g., docker.io/username/app)
    - name: dockerfile
      type: string
      description: Path to Dockerfile within workspace
      default: Dockerfile
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      workingDir: $(workspaces.source.path)
      env:
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker/
      script: |
        #!/busybox/sh
        set -e

        echo "📊 === GENERATE TAG ==="
        SHA=$(git rev-parse --short HEAD || echo "no-git-sha")
        TS=$(date +%Y%m%d%H%M%S)
        TAG="$SHA-$TS"
        echo "Generated tag: $TAG"

        echo "📦 === BUILD & PUSH IMAGE ==="
        /kaniko/executor \
          --dockerfile=$(workspaces.source.path)/$(params.dockerfile) \
          --context=$(workspaces.source.path) \
          --destination=$(params.image):$TAG \
          --destination=$(params.image):latest

        echo "✅ Build & push completed!"

