apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: fetch-source-task
  namespace: dev
spec:
  params:
    - name: repo-url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      description: Branch or tag
      default: main
  workspaces:
    - name: output
      description: Directory to clone repo into
  steps:
  - name: clone
    image: alpine/git
    workingDir: $(workspaces.output.path)
    env:
      - name: HOME
        value: /tekton/home
    script: |
      #!/bin/sh
      echo "📊 === GIT CLONE STARTED ==="
      echo "📦 Repo: $(params.repo-url)"
      echo "🌀 Branch/Tag/Commit: $(params.revision)"
      echo "📁 Target directory: $(workspaces.output.path)"

      if [ -d .git ]; then
        echo "🔄 Repo already exists, pulling latest..."
        git fetch origin $(params.revision)
        git checkout $(params.revision)
        git reset --hard origin/$(params.revision)
      else
        echo "🔽 Fresh clone..."
        git clone --branch $(params.revision) $(params.repo-url) .
      fi

      echo "🔍 Latest commit:"
      git log -1 --oneline
      echo "📋 Files:"
      ls -la
      echo "📊 === GIT CLONE COMPLETED ==="

